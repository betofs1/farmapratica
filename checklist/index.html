<title>Checklist de Rotina e Autoinspeção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Paleta grafite médio/escuro — igual à página inicial (INDEX), tema padrão */
    --bg: #5a5f66;
    --panel: #4a4e55;
    --sidebar: #454951;
    --card: #4f545c;
    --card-hover: #585d65;
    --border: #63686f;
    --red-dark: #a10f1f;
    --red: #e4172c;
    --red-bright: #ef5b6b;
    --red-glow: rgba(228,23,44,0.22);
    --text: #f5f5f4;
    --text-dim: #a7abb1;
    --text-gray: #d2d5d9;
    --amber: #f59e0b;
    --pill-bg: #674a54;
    --pill-text: #a10f1f;
    --green: #2e9b6f;
    --blue: #3b82f6;
    --sidebar-w: 340px;
    --hover-tint: #585d65;
  }

  /* ---------- Tema claro — igual à página inicial (INDEX) ---------- */
  body.light{
    --bg: #eceef1;
    --panel: #f6f7f9;
    --sidebar: #e2e5e9;
    --card: #ffffff;
    --card-hover: #f1f2f5;
    --border: #d7dade;
    --red-dark: #a10f1f;
    --red: #d4152a;
    --red-bright: #eb374b;
    --red-glow: rgba(212,21,42,0.14);
    --text: #22262c;
    --text-dim: #767c84;
    --text-gray: #4b5057;
    --amber: #c9790a;
    --pill-bg: #fbe8ea;
    --pill-text: #a10f1f;
    --green: #1f8a5f;
    --blue: #2563eb;
    --hover-tint: #eceef1;
  }
  body.light .cat-item:hover{ color:#000; }
  body.light .empty-icon{ background: linear-gradient(135deg, rgba(161,15,31,.12), rgba(245,158,11,.12)); }
  body.light .resumo-bar{ background: linear-gradient(135deg, rgba(161,15,31,.06), rgba(245,158,11,.05)); }
  body.light .theme-toggle .icon-sun{ display:none; }
  body.light .theme-toggle .icon-moon{ display:block; }
  body.light{ background: var(--bg) !important; }
  *{ box-sizing: border-box; }
  button, input, select, textarea{ font-family: inherit; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(228,23,44,.07), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(245,158,11,.04), transparent 55%),
      var(--bg);
    color: var(--text);
    display:flex;
    flex-direction: column;
    height:100vh;
    overflow:hidden;
    transition: background-color .2s ease, color .2s ease;
  }

  /* ---------- Topbar ---------- */
  .topbar-app{
    display:grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    align-items:center;
    min-height: 84px;
    flex-shrink:0;
    padding: 20px 40px 20px 0;
    background: var(--sidebar);
    border-bottom: 2px solid rgba(228,23,44,.35);
    position: relative;
    box-shadow: 0 2px 20px rgba(0,0,0,.15);
    z-index: 3;
  }
  .topbar-actions{
    position:absolute;
    right:40px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .theme-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    border-radius:9px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    flex-shrink:0;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{ background: var(--hover-tint); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:none; }
  .btn-relatorio{
    display:flex;
    align-items:center;
    gap:7px;
    height:38px;
    padding: 0 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-size:.8rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-relatorio:hover{ background: var(--hover-tint); border-color: var(--red-bright); color: var(--red-bright); }
  .dropdown-imprimir{ position:relative; }
  .chevron-dd{ width:11px !important; height:11px !important; opacity:.6; }
  .dropdown-menu{
    display:none; position:absolute; top:calc(100% + 8px); right:0;
    width:280px; background: var(--card); border:1px solid var(--border);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    padding:6px; z-index:20;
  }
  .dropdown-menu.open{ display:block; }
  .dropdown-menu button{
    display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
    background:none; border:none; padding:10px 10px; border-radius:8px;
    cursor:pointer; color: var(--text);
  }
  .dropdown-menu button:hover{ background: var(--hover-tint); }
  .dropdown-menu button .ic{ width:17px; height:17px; margin-top:2px; color: var(--red-bright); flex-shrink:0; }
  .dropdown-menu button span{ display:flex; flex-direction:column; gap:2px; }
  .dropdown-menu button b{ font-size:.84rem; font-weight:700; }
  .dropdown-menu button small{ font-size:.72rem; color: var(--text-dim); font-weight:400; line-height:1.4; }
  .modo-toggle{
    display:flex; align-items:center; gap:7px; height:38px; padding: 0 14px;
    border-radius:9px; border:1px solid rgba(245,158,11,.45);
    background: rgba(245,158,11,.08); color: var(--amber);
    font-size:.8rem; font-weight:800; cursor:pointer; white-space:nowrap;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .modo-toggle:hover{ background: rgba(245,158,11,.16); }
  .modo-toggle .ic{ width:14px; height:14px; }
  @media (max-width: 800px){
    .topbar-actions{ right:14px; }
    .btn-relatorio-txt{ display:none; }
    .btn-relatorio{ padding:0 10px; }
    .chevron-dd{ display:none; }
    #modo-texto{ display:none; }
    .modo-toggle{ padding:0 10px; }
    .dropdown-menu{ width: min(280px, calc(100vw - 28px)); }
  }
  .topbar-app .logo-wrap{
    grid-column:1;
    display:flex;
    align-items:center;
    padding-left: 40px;
  }
  .topbar-app .logo-wrap a{
    display:flex;
    align-items:center;
    text-decoration:none;
    color:inherit;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand img{ width:50px; height:50px; }
  .brand-text h1{
    font-size:25px;
    font-weight:800;
    letter-spacing:-0.3px;
    line-height:1.1;
    margin:0;
    color: var(--text);
  }
  .brand-text h1 span{ color:var(--red-bright); }
  .brand-text p{
    font-size:12.5px;
    color:var(--text-gray);
    font-weight:400;
    margin:2px 0 0;
  }
  .topbar-app .titulo-central{
    grid-column:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .topbar-app .titulo-principal{
    font-size: 1.05rem;
    font-weight:800;
    white-space:normal;
    letter-spacing:.5px;
    max-width: 480px;
  }
  .topbar-app .titulo-descricao{
    font-size: .74rem;
    color: var(--text-dim);
    margin-top:2px;
    white-space:normal;
    max-width: 480px;
  }
  @media (max-width: 800px){
    .topbar-app{ grid-template-columns: 1fr; padding: 8px 14px; }
    .topbar-app .logo-wrap{ padding-left:0; justify-content:center; margin-bottom:6px; }
    .topbar-app .titulo-central{ grid-column:1; }
  }

  .app-body{ display:flex; flex:1; min-height:0; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width: var(--sidebar-w);
    flex-shrink:0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    height:100%;
    box-shadow: 4px 0 24px rgba(0,0,0,.15);
    z-index: 2;
  }
  .sidebar-header{ padding: 18px 16px 14px; }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:24px;
    padding: 9px 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
    margin-bottom: 10px;
  }
  .search-box:focus-within{ border-color: var(--red-bright); box-shadow: 0 0 0 3px var(--red-glow); }
  .search-box input{
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:.85rem; width:100%;
  }
  .btn-fonte-dados{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding: 11px 12px;
    border-radius:24px;
    border: 1px dashed rgba(245,158,11,.5);
    background: linear-gradient(135deg, rgba(245,158,11,.14), rgba(161,15,31,.08));
    color: var(--amber);
    font-size:.8rem;
    font-weight:800;
    cursor:pointer;
    letter-spacing:.2px;
    transition: transform .1s ease, background .15s ease;
  }
  .btn-fonte-dados:hover{ transform: translateY(-1px); background: linear-gradient(135deg, rgba(245,158,11,.22), rgba(161,15,31,.12)); }
  .btn-fonte-dados.active{ background: linear-gradient(135deg, var(--red-dark), var(--red)); color:#fff; border-color: transparent; border-style:solid; }

  /* ---------- Navegação em "trilha" vertical (estilo timeline) ---------- */
  .sidebar-list{ flex:1; overflow-y:auto; padding: 6px 14px 24px; }
  .pin-row{ display:flex; flex-direction:column; gap:8px; margin-bottom: 18px; }
  .pin-card{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; cursor:pointer;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px;
    color: var(--text); font-size:.87rem; font-weight:700;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .ic{ width:16px; height:16px; flex-shrink:0; display:inline-block; vertical-align:-3px; }
  .ic-inline{ display:inline-flex; align-items:center; }
  .ic-inline .ic{ width:1.2em; height:1.2em; }
  .ic-freq{ width:12px; height:12px; vertical-align:-2px; margin-right:1px; }
  .btn-ghost .ic, .btn-relatorio .ic, .btn-fonte-dados .ic{ width:14px; height:14px; }
  .pin-card .pin-ic{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1rem;
    background: var(--card);
  }
  .pin-card .pin-ic .ic{ width:16px; height:16px; }
  .pin-card:hover{ transform: translateX(2px); border-color: var(--red-bright); }
  .pin-card.active{ background: linear-gradient(135deg, var(--red-dark), var(--red)); color:#fff; border-color:transparent; }
  .pin-card.active .pin-ic{ background: rgba(255,255,255,.18); }
  .pin-card.nc-pin{ color: var(--pill-text); }
  .pin-card.hoje-cta{
    background: linear-gradient(135deg, rgba(245,158,11,.16), rgba(161,15,31,.1));
    border-color: rgba(245,158,11,.4);
    color: var(--text);
  }
  .pin-card.hoje-cta .pin-ic{ background: linear-gradient(135deg, var(--amber), var(--red-bright)); color:#fff; }
  .pin-card.hoje-cta .pin-badge{ background: var(--amber); border-color: transparent; color:#1a1200; }
  .pin-card.hoje-cta.active{ background: linear-gradient(135deg, var(--red-dark), var(--red)); border-color:transparent; color:#fff; }
  .pin-card.hoje-cta.active .pin-badge{ background: rgba(255,255,255,.22); color:#fff; }
  .pin-card .pin-badge{
    margin-left:auto; font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:20px;
    background: var(--card); border:1px solid var(--border); color:var(--text-dim); flex-shrink:0;
  }
  .pin-card.active .pin-badge{ background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); color:#fff; }

  .rail-group{ position:relative; padding-left:20px; margin-bottom:22px; }
  .rail-group::before{
    content:''; position:absolute; left:6px; top:22px; bottom:10px; width:2px;
    background: linear-gradient(var(--rail-color), transparent 95%);
    opacity:.35;
  }
  .rail-title{
    display:flex; align-items:center; gap:8px; position:relative;
    font-size:.68rem; text-transform:uppercase; letter-spacing:1px; font-weight:800;
    color: var(--rail-color); margin-bottom:12px; margin-left:-20px; padding-left:20px;
  }
  .rail-title::before{
    content:''; position:absolute; left:2px; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%; background: var(--rail-color);
    box-shadow: 0 0 0 3px var(--hover-tint);
  }
  .rail-node{ position:relative; margin-bottom:10px; }
  .rail-node::before{
    content:''; position:absolute; left:-17px; top:50%; transform:translateY(-50%);
    width:7px; height:7px; border-radius:50%; background: var(--rail-color); opacity:.7;
  }
  .rail-card{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px 10px 10px; cursor:pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .rail-card:hover{ transform: translateX(3px); border-color: var(--rail-color); }
  .rail-card.active{
    background: linear-gradient(135deg, var(--red-dark), var(--red));
    border-color: transparent;
  }
  .rail-card .rc-ic{ flex-shrink:0; width:20px; height:20px; display:flex; align-items:center; justify-content:center; color: var(--rail-color); }
  .rail-card .rc-ic .ic{ width:18px; height:18px; }
  .rail-card.active .rc-ic{ color:#fff; }
  .rail-card .rc-label{
    flex:1; min-width:0; font-size:.85rem; font-weight:700; color: var(--text);
    white-space: normal; line-height:1.3; word-break: break-word;
  }
  .rail-card.active .rc-label{ color:#fff; }
  .rail-card .rc-ring{ flex-shrink:0; }
  .rail-card .rc-ring text{ fill: var(--text-dim); font-size: 8px; font-weight:800; font-family:'Manrope',sans-serif; }
  .rail-card.active .rc-ring text{ fill:#fff; }
  .rail-card.active .rc-ring .ring-track{ stroke: rgba(255,255,255,.25); }

  /* ---------- Main ---------- */
  .main{ flex:1; display:flex; justify-content:center; padding: 26px 40px 60px; overflow-y:auto; height:100%; }
  .main-inner{ width:100%; max-width: 860px; }
  .main-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap:wrap;
  }
  .main-header h2{ margin:0; font-size: 1.6rem; letter-spacing:-.2px; display:flex; align-items:center; gap:10px; }
  .main-header .tags-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .main-header-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-tag{
    display:inline-block;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.6px;
    font-weight:800;
    color: var(--amber);
    background: rgba(245,158,11,.08);
    border: 1px solid rgba(245,158,11,.3);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .status-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.6px;
    font-weight:800;
    padding: 3px 10px;
    border-radius: 20px;
    border:1px solid var(--border);
  }
  .status-chip.ok{ color: var(--green); background: rgba(46,155,111,.1); border-color: rgba(46,155,111,.3); }
  .status-chip.atencao{ color: var(--amber); background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); }
  .status-chip.critico{ color: var(--red-bright); background: rgba(228,23,44,.1); border-color: rgba(228,23,44,.3); }

  .btn-ghost{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border: 1px solid var(--border);
    color: var(--text-gray);
    background: transparent;
    padding: 8px 16px;
    border-radius: 20px;
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s, transform .1s, border-color .15s;
  }
  .btn-ghost:hover{ background: var(--hover-tint); border-color: var(--red-bright); color: var(--red-bright); transform: translateY(-1px); }
  .btn-ghost.primario{ border-color: var(--green); color: var(--green); }
  .btn-ghost.primario:hover{ background: rgba(46,155,111,.1); border-color: var(--green); color: var(--green); }
  .btn-ghost.perigo{ border-color: var(--red-bright); color: var(--red-bright); }
  .btn-ghost.perigo:hover{ background: rgba(228,23,44,.12); border-color: var(--red-bright); color: var(--red-bright); }

  /* ---------- Barra de progresso ---------- */
  .resumo-bar{
    background: linear-gradient(135deg, rgba(161,15,31,.1), rgba(245,158,11,.05));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 22px;
    margin-bottom: 26px;
  }
  .resumo-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:12px; flex-wrap:wrap; }
  .resumo-top .resumo-info{ font-size:.82rem; color: var(--text-gray); }
  .resumo-top .resumo-info b{ color: var(--text); font-size:1rem; }
  .progress-track{
    width:100%;
    height:10px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--red-dark), var(--red-bright));
    border-radius:20px;
    transition: width .3s ease;
  }
  .progress-fill.full{ background: linear-gradient(90deg, #166a48, var(--green)); }

  /* ---------- Itens do checklist ---------- */
  .itens-grid{ display:flex; flex-direction:column; gap: 12px; }
  .item-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,.14);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .item-card.checked{ opacity:.6; }
  .item-card.simples .chevron{ display:none; }
  .item-card.simples .item-detail{ display:none !important; }
  .item-card.simples .item-main{ cursor:pointer; }
  .item-cat-tag{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.3px;
    color: var(--red-bright); background: rgba(228,23,44,.08);
    border-radius:20px; padding:2px 9px; margin-bottom:6px;
  }
  .item-cat-tag .ic{ width:11px; height:11px; }
  .item-main{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; }
  .item-check{
    flex-shrink:0;
    width:22px; height:22px;
    border-radius:6px;
    border: 2px solid var(--border);
    margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    font-size:.75rem;
    color:#fff;
    transition: background .15s, border-color .15s;
  }
  .item-card.checked .item-check{ background: linear-gradient(135deg, var(--red-dark), var(--red-bright)); border-color: var(--red-bright); }
  .item-texto{ flex:1; font-size:.9rem; line-height:1.4; color: var(--text); }
  .item-card.checked .item-texto{ text-decoration: line-through; color: var(--text-dim); }
  .item-ts{ margin-top:3px; font-size:.72rem; text-decoration:none; color: var(--green); font-weight:600; }
  .crit-dot{ flex-shrink:0; font-size:.7rem; margin-top:3px; }
  .chevron{ flex-shrink:0; color: var(--text-dim); font-size:.7rem; margin-top:3px; transition: transform .15s; user-select:none; }
  .item-card.aberto .chevron{ transform: rotate(90deg); }
  .item-detail{
    display:none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .item-card.aberto .item-detail{ display:block; }
  .item-detail .linha{ display:flex; gap:8px; font-size:.8rem; line-height:1.55; color: var(--text-gray); margin-bottom:10px; }
  .item-detail .linha .rotulo{ flex-shrink:0; font-weight:800; color: var(--text); min-width:96px; }
  .item-detail .linha.correcao .rotulo{ color: var(--red-bright); }
  .normas-wrap{ margin-top:2px; }
  .normas-wrap .rotulo{ display:block; font-weight:800; color: var(--text); font-size:.8rem; margin-bottom:8px; }
  .norma-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: .78rem;
    line-height: 1.55;
  }
  .norma-card:last-child{ margin-bottom:0; }
  .norma-card .norma-titulo{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .norma-card .norma-sigla{ font-weight:800; color: var(--blue); }
  .norma-card .norma-orgao{ font-size:.66rem; text-transform:uppercase; letter-spacing:.4px; color: var(--text-dim); font-weight:700; }
  .norma-card .norma-nome{ color: var(--text); font-weight:600; margin-bottom:4px; }
  .norma-card .norma-contexto{ color: var(--text-gray); }
  .norma-card .norma-link{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:6px; font-size:.72rem; font-weight:700;
    color: var(--red-bright); text-decoration:none;
  }
  .norma-card .norma-link:hover{ text-decoration:underline; }

  .fonte-tag{
    margin-top: 20px;
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-size: .74rem;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .fonte-tag b{ color: var(--text); }

  /* ---------- Painel Fonte de Dados ---------- */
  .fonte-grupo{ margin-bottom: 22px; }
  .fonte-grupo h3{ font-size:.85rem; font-weight:800; color: var(--amber); text-transform:uppercase; letter-spacing:.5px; margin: 0 0 10px; }
  .fonte-item{
    background: var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding: 14px 16px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    flex-wrap:wrap;
  }
  .fonte-item .fi-main{ flex:1; min-width:220px; }
  .fonte-item .fi-sigla{ font-weight:800; color: var(--blue); font-size:.9rem; }
  .fonte-item .fi-titulo{ font-size:.84rem; color: var(--text); font-weight:600; margin:3px 0; }
  .fonte-item .fi-contexto{ font-size:.78rem; color: var(--text-gray); line-height:1.5; }
  .fonte-item .fi-link{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--red-bright); color: var(--red-bright);

    font-size:.76rem; font-weight:700; text-decoration:none; white-space:nowrap;
    transition: background .15s;
  }
  .fonte-item .fi-link:hover{ background: rgba(228,23,44,.1); }

  /* ---------- Dashboard ---------- */
  .estab-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .estab-head{
    display:flex; align-items:center; gap:8px;
    font-size:.8rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color: var(--text-dim); margin-bottom:14px;
  }
  .estab-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .estab-campo label{
    display:block; font-size:.7rem; font-weight:700; color: var(--text-dim);
    text-transform:uppercase; letter-spacing:.3px; margin-bottom:5px;
  }
  .estab-campo input{
    width:100%; background: var(--card); border:1px solid var(--border); border-radius:8px;
    color: var(--text); padding: 9px 11px; font-size:.85rem; outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .estab-campo input:focus{ border-color: var(--red-bright); box-shadow: 0 0 0 3px var(--red-glow); }
  .estab-nota{ margin-top:12px; font-size:.72rem; color: var(--text-dim); }

  .spark-wrap{ margin-bottom:14px; }
  .spark-svg{ width:100%; height:64px; display:block; }
  .spark-vazio{ font-size:.8rem; color: var(--text-dim); padding: 10px 0; }

  .versao-footer{
    text-align:center; font-size:.7rem; color: var(--text-dim);
    margin-top: 26px; padding-top:14px; border-top:1px solid var(--border);
    letter-spacing:.2px;
  }

  .dash-resumo-global{
    background: linear-gradient(120deg, var(--red-dark) 0%, #1a0505 100%);
    border-radius:16px;
    padding: 22px 26px;
    margin-bottom: 24px;
    color:#fff;
  }
  body.light .dash-resumo-global{ background: linear-gradient(120deg, var(--red) 0%, #4a0c15 100%); }
  .dash-resumo-global h3{ margin:0 0 4px; font-size:1.05rem; font-weight:800; }
  .dash-resumo-global p{ margin:0 0 14px; font-size:.8rem; color: rgba(255,255,255,.75); }
  .dash-resumo-global .progress-track{ background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.25); }
  .dash-resumo-global .progress-fill{ background: #fff; }
  .dash-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .dash-card{
    background: var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding: 16px 18px;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.14);
    transition: background .15s, transform .1s, border-color .15s;
  }
  .dash-card:hover{ background: var(--card-hover); transform: translateY(-2px); border-color: var(--red-bright); }
  .dash-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .dash-card-head .ic{ width:22px; height:22px; color: var(--red-bright); }
  .dash-card h4{ margin:0 0 4px; font-size:.9rem; font-weight:700; }
  .dash-card .freq-tag{ font-size:.66rem; color: var(--text-dim); text-transform:uppercase; letter-spacing:.4px; font-weight:700; margin-bottom:10px; }
  .dash-card .progress-track{ height:7px; margin-bottom:6px; }
  .dash-card .pct-row{ display:flex; justify-content:space-between; font-size:.72rem; color: var(--text-dim); }

  .historico-box{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding: 16px 20px;
  }
  .historico-box h3{ margin:0 0 12px; font-size:.85rem; text-transform:uppercase; letter-spacing:.5px; color: var(--text-dim); }
  .historico-linha{ display:flex; justify-content:space-between; align-items:center; font-size:.84rem; padding:6px 0; border-bottom:1px solid var(--border); }
  .historico-linha:last-child{ border-bottom:none; }
  .historico-linha .hd{ color: var(--text-gray); }
  .historico-linha .hp{ font-weight:800; }
  .historico-vazio{ font-size:.82rem; color: var(--text-dim); }

  /* ---------- Não conformidades ---------- */
  .nc-table-wrap{ overflow-x:auto; }
  table.nc-table{ width:100%; border-collapse: collapse; font-size:.85rem; }
  table.nc-table th{
    text-align:left;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.5px;
    color: var(--text-dim);
    border-bottom:1px solid var(--border);
    padding: 8px 10px;
  }
  table.nc-table td{ padding: 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.nc-table tr:last-child td{ border-bottom:none; }
  .grav-chip{ font-size:.7rem; font-weight:800; padding:2px 9px; border-radius:20px; display:inline-block; }
  .grav-chip.alta{ color: var(--red-bright); background: rgba(228,23,44,.12); }
  .grav-chip.media{ color: var(--amber); background: rgba(245,158,11,.12); }
  .grav-chip.baixa{ color: var(--text-dim); background: var(--panel); }
  .nc-sec-title{ font-size:.85rem; font-weight:800; color: var(--text); margin: 22px 0 10px; }

  .nc-form input[type=text]{
    flex:1; min-width:180px;

  .nc-form select{
    background: var(--panel); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 10px; font-size:.82rem; outline:none;
  }
  .nc-form button{
    background: linear-gradient(135deg, var(--red-dark), var(--red-bright));

  .nc-empty{ font-size:.82rem; color: var(--text-dim); padding: 10px 0; }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 70px 20px; color: var(--text-dim);
  }
  .empty-state .empty-icon{
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(161,15,31,.18), rgba(245,158,11,.1));
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size: 2rem; margin-bottom: 18px;
  }

  .aviso-responsabilidade{
    margin-top: 28px;

    border: 1px solid rgba(228,23,44,.35);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .aviso-responsabilidade .aviso-titulo{
    display:flex; align-items:center; gap:8px;
    font-size: .95rem; font-weight:800; color: var(--red-bright);
    margin-bottom: 12px; letter-spacing:.2px;
  }
  .aviso-responsabilidade p{ font-size: .78rem; line-height: 1.6; color: var(--text-gray); margin: 0 0 4px; }

  @media (max-width: 800px){

  /* ---------- Relatório para impressão / PDF ---------- */

function sparklineSVG(hist){
  if(!hist || hist.length < 2){
    return `<div class="spark-vazio">O gráfico aparece a partir de 2 dias de histórico registrado.</div>`;
  }
  const pontos = [...hist].reverse(); // ordem cronológica (mais antigo → mais recente)
  const w = 280, h = 64, pad = 8;
  const n = pontos.length;
  const stepX = n > 1 ? (w - 2*pad) / (n - 1) : 0;
  const coords = pontos.map((p, i) => {
    const x = pad + i * stepX;
    const y = pad + (1 - p.percentual/100) * (h - 2*pad);
    return [x, y];
  });
  const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  const circles = coords.map((c, i) => {
    const cor = pontos[i].percentual === 100 ? 'var(--green)' : (pontos[i].percentual >= 70 ? 'var(--amber)' : 'var(--red-bright)');
    return `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.6" fill="${cor}" stroke="var(--card)" stroke-width="1.2"/>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" class="spark-svg" preserveAspectRatio="none">
      <path d="${areaD}" fill="var(--red-glow)" stroke="none"/>
      <path d="${pathD}" fill="none" stroke="var(--red-bright)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${circles}
    </svg>`;
}

// migração de formato antigo (booleano) para o novo formato {checked, ts}
Object.keys(estado).forEach(id => {

function estaMarcado(id){ return !!(estado[id] && estado[id].checked); }
function marcarItem(id, valor){
  estado[id] = { checked: valor, ts: valor ? new Date().toISOString() : null };
}
function dataHoraFormatada(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

// ---------- Reset automático por período ----------
function hojeISO(d){ return d.toISOString().slice(0,10); }
function semanaISO(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((dt - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return dt.getUTCFullYear() + '-W' + String(week).padStart(2,'0');
}
function mesISO(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

function percentualPeriodo(freq){
  const itens = TODOS_ITENS.filter(i => DATA.categorias.find(c=>c.id===i.catId).freq === freq);
  if(itens.length === 0) return 0;
  const marcados = itens.filter(i => estaMarcado(i.id)).length;
  return Math.round((marcados/itens.length)*100);
}

function resetarPeriodo(freq){
  DATA.categorias.filter(c => c.freq === freq).forEach(c => {
    c.itens.forEach(i => { marcarItem(i.id, false); });
  });
}

(function verificarResets(){
  const agora = new Date();
  const diaAtual = hojeISO(agora);
  const semanaAtual = semanaISO(agora);
  const mesAtual = mesISO(agora);

  if(lastReset.diario && lastReset.diario !== diaAtual){
    const pct = percentualPeriodo('diario');
    historico.unshift({ data: lastReset.diario, percentual: pct });
    historico = historico.slice(0, 14);
    resetarPeriodo('diario');
  }
  if(lastReset.semanal && lastReset.semanal !== semanaAtual){
    resetarPeriodo('semanal');
  }
  if(lastReset.mensal && lastReset.mensal !== mesAtual){
    resetarPeriodo('mensal');
  }
  lastReset = { diario: diaAtual, semanal: semanaAtual, mensal: mesAtual };
  salvarJSON(K_RESET, lastReset);
  salvarJSON(K_STATE, estado);
  salvarJSON(K_HIST, historico);
})();

function ringSVG(pct, ativo){
  const r = 12, cx = 15, cy = 15, circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct/100);
  const trackColor = ativo ? 'rgba(255,255,255,.25)' : 'var(--border)';
  const fillColor = pct === 100 ? 'var(--green)' : (ativo ? '#fff' : 'var(--rail-color)');
  return `
    <svg class="rc-ring" width="30" height="30" viewBox="0 0 30 30">
      <circle class="ring-track" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="3"></circle>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${fillColor}" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${cx} ${cy})"></circle>
      <text x="15" y="16" text-anchor="middle" dominant-baseline="middle">${pct}</text>
    </svg>`;
}

  document.getElementById('btn-fonte-dados').classList.toggle('active', categoriaAtual === 'fontes');

  // Fixados no topo: Rotina de Hoje (CTA) + Visão Geral
  const pendentesHoje = contarPendenciasHoje();
  const pinRow = document.createElement('div');
  pinRow.className = 'pin-row';
  const hojeBtn = document.createElement('button');
  hojeBtn.className = 'pin-card hoje-cta' + (categoriaAtual==='hoje' ? ' active' : '');
  hojeBtn.innerHTML = `<span class="pin-ic">${svg('sun')}</span><span>Rotina de Hoje</span><span class="pin-badge">${pendentesHoje}</span>`;
  hojeBtn.onclick = abrirRotinaHoje;
  pinRow.appendChild(hojeBtn);
  const dashBtn = document.createElement('button');
  dashBtn.className = 'pin-card' + (categoriaAtual===null ? ' active' : '');
  dashBtn.innerHTML = `<span class="pin-ic">${svg('home')}</span><span>Visão Geral</span>`;
  dashBtn.onclick = () => { categoriaAtual = null; renderSidebar(document.getElementById('busca').value); renderMain(); };
  pinRow.appendChild(dashBtn);
  lista.appendChild(pinRow);

  if(termo){
    const encontrados = TODOS_ITENS.filter(i => i.texto.toLowerCase().includes(termo));
    const wrap = document.createElement('div');
    wrap.className = 'rail-group';
    wrap.style.setProperty('--rail-color', 'var(--text-dim)');
    const header = document.createElement('div');
    header.className = 'rail-title';
    header.textContent = `Resultados (${encontrados.length})`;
    wrap.appendChild(header);
    if(encontrados.length === 0){
      const vazio = document.createElement('div');
      vazio.className = 'nc-empty';
      vazio.textContent = 'Nenhum item encontrado.';
      wrap.appendChild(vazio);
    }
    encontrados.forEach(i => {
      const node = document.createElement('div');
      node.className = 'rail-node';
      const btn = document.createElement('button');
      btn.className = 'rail-card' + (categoriaAtual === i.catId ? ' active' : '');
      btn.innerHTML = `<span class="rc-ic">${svg(CAT_ICON[i.catId])}</span><span class="rc-label">${i.texto}</span>`;
      btn.onclick = () => { categoriaAtual = i.catId; renderMain(true, i.id); };
      node.appendChild(btn);
      wrap.appendChild(node);
    });
    lista.appendChild(wrap);
    return;
  }

  ['diario','semanal','mensal'].forEach(freq => {
    const cats = DATA.categorias.filter(c => c.freq === freq);
    if(cats.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'rail-group';
    wrap.style.setProperty('--rail-color', RAIL_COLOR[freq]);
    const header = document.createElement('div');
    header.className = 'rail-title';
    header.innerHTML = `${DATA.freqIcon[freq]} <span>${DATA.freqLabel[freq]}</span>`;
    wrap.appendChild(header);
    cats.forEach(c => {
      const { total, marcados } = contagemCategoria(c);
      const pct = total ? Math.round((marcados/total)*100) : 0;
      const ativo = categoriaAtual === c.id;
      const node = document.createElement('div');
      node.className = 'rail-node';
      const btn = document.createElement('button');
      btn.className = 'rail-card' + (ativo ? ' active' : '');
      btn.innerHTML = `<span class="rc-ic">${svg(CAT_ICON[c.id])}</span><span class="rc-label">${c.nome}</span>${ringSVG(pct, ativo)}`;
      btn.onclick = () => { categoriaAtual = c.id; renderSidebar(); renderMain(); };
      node.appendChild(btn);
      wrap.appendChild(node);
    });
    lista.appendChild(wrap);
  });

  // Fixados embaixo: Não Conformidades e Fonte de Dados fica no cabeçalho fixo (fora desta lista)
  const pinRow2 = document.createElement('div');
  pinRow2.className = 'pin-row';
  pinRow2.style.marginTop = '4px';
  const ncBtn = document.createElement('button');
  const ncAbertas = contarNaoConformidadesAbertas();
  ncBtn.className = 'pin-card nc-pin' + (categoriaAtual === 'nc' ? ' active' : '');
  ncBtn.innerHTML = `<span class="pin-ic">${svg('alert-triangle')}</span><span>Não Conformidades</span><span class="pin-badge">${ncAbertas}</span>`;
  ncBtn.onclick = () => { categoriaAtual = 'nc'; renderSidebar(); renderMain(); };
  pinRow2.appendChild(ncBtn);
  lista.appendChild(pinRow2);
}

document.getElementById('busca').addEventListener('input', e => renderSidebar(e.target.value));

// =====================================================================
// STATUS DA CATEGORIA (semáforo)
// =====================================================================
function statusCategoria(cat){
  const { total, marcados } = contagemCategoria(cat);
  const altasAbertas = cat.itens.filter(i => i.crit === 'alta' && !estaMarcado(i.id)).length;
  if(altasAbertas > 0) return { classe:'critico', label:'🔴 Não Conforme' };
  if(marcados < total) return { classe:'atencao', label:'🟡 Atenção' };
  return { classe:'ok', label:'🟢 Conforme' };
}

// =====================================================================
// RENDER: cartão de norma reutilizável
// =====================================================================
function renderNormaCard(chave){
  const n = NORMAS[chave];
  if(!n) return '';
  return `
    <div class="norma-card">
      <div class="norma-titulo">
        <span class="norma-sigla">${n.tipo} ${n.numero}</span>
        <span class="norma-orgao">${n.orgao}</span>
      </div>
      <div class="norma-nome">${n.titulo}</div>
      <div class="norma-contexto">${n.contexto}</div>
      <a class="norma-link" href="${n.link}" target="_blank" rel="noopener">Consultar norma completa ↗</a>
    </div>
  `;
}

// =====================================================================
// RENDER PRINCIPAL
// =====================================================================
// =====================================================================
// CARD DE ITEM (reutilizado pela visão de categoria e pela Rotina de Hoje)
// =====================================================================
function criarItemCard(item, opts={}){
  const abrir = !!opts.abrir;
  const checked = estaMarcado(item.id);
  const ts = estado[item.id] ? estado[item.id].ts : null;
  const dot = item.crit === 'alta' ? '🔴' : item.crit === 'media' ? '🟡' : '🟢';
  const normasHtml = (item.normas || []).map(renderNormaCard).join('');
  const tagCategoria = item.catId ? `<div class="item-cat-tag">${svg(CAT_ICON[item.catId])} ${item.catNome}</div>` : '';
  const card = document.createElement('div');
  card.className = 'item-card' + (checked ? ' checked' : '') + (abrir ? ' aberto' : '') + (modoSimples ? ' simples' : '');
  card.innerHTML = `
    <div class="item-main">
      <div class="item-check" data-role="check">${checked ? '✓' : ''}</div>
      <div class="item-texto">
        ${tagCategoria}
        ${item.texto}
        ${checked ? `<div class="item-ts">✔ conferido em ${dataHoraFormatada(ts)}</div>` : ''}
      </div>
      <div class="crit-dot">${dot}</div>
      <div class="chevron" data-role="chevron">▶</div>
    </div>
    <div class="item-detail">
      <div class="linha"><span class="rotulo">Por que</span><span>${item.motivo}</span></div>
      <div class="linha correcao"><span class="rotulo">Se não conforme</span><span>${item.correcao}</span></div>
      <div class="normas-wrap">
        <span class="rotulo">Base legal</span>
        ${normasHtml}
      </div>
    </div>
  `;
  const alternarMarcado = (ev) => {
    if(ev) ev.stopPropagation();
    marcarItem(item.id, !estaMarcado(item.id));
    salvarJSON(K_STATE, estado);
    renderSidebar(document.getElementById('busca').value);
    renderMain();
  };
  if(modoSimples){
    card.querySelector('.item-main').addEventListener('click', alternarMarcado);
  } else {
    card.querySelector('[data-role="check"]').addEventListener('click', alternarMarcado);
    card.querySelector('.item-main').addEventListener('click', () => {
      card.classList.toggle('aberto');
    });
  }
  return card;
}

function renderMain(abrirItem=false, itemIdParaAbrir=null){
  const el = document.getElementById('conteudo');

  if(categoriaAtual === null){ renderDashboard(el); return; }
  if(categoriaAtual === 'hoje'){ renderRotinaHoje(el); return; }
  if(categoriaAtual === 'nc'){ renderNaoConformidades(el); return; }
  if(categoriaAtual === 'fontes'){ renderFontesDados(el); return; }

  const cat = DATA.categorias.find(c => c.id === categoriaAtual);
  const { total, marcados } = contagemCategoria(cat);
  const pct = total ? Math.round((marcados/total)*100) : 0;
  const status = statusCategoria(cat);
  const todosMarcados = marcados === total;

  el.innerHTML = `
    <div class="main-header">
      <div>
        <h2><span class="ic-inline">${svg(CAT_ICON[cat.id])}</span> ${cat.nome}</h2>
        <div class="tags-row">
          <span class="cat-tag">${DATA.freqIcon[cat.freq]} ${DATA.freqLabel[cat.freq]}</span>
          <span class="status-chip ${status.classe}">${status.label}</span>
        </div>
      </div>
      <div class="main-header-actions">
        <button class="btn-ghost primario" id="btn-marcar-todos">${svg('check-check')} ${todosMarcados ? 'Todos marcados' : 'Marcar Todos'}</button>
        <button class="btn-ghost" id="btn-reset-cat">${svg('refresh-ccw')} Reiniciar rotina</button>
      </div>
    </div>

    <div class="resumo-bar">
      <div class="resumo-top">
        <div class="resumo-info"><b>${marcados}/${total}</b> itens conferidos hoje</div>
        <div class="resumo-info"><b>${pct}%</b></div>
      </div>
      <div class="progress-track"><div class="progress-fill ${pct===100?'full':''}" style="width:${pct}%"></div></div>
    </div>

    <div class="itens-grid" id="itens-grid"></div>
    <div class="fonte-tag">${svg('book-open')} Base normativa consolidada a partir de RDCs, portarias e resoluções vigentes — veja o painel "Fonte de Dados" no menu para os links oficiais.</div>
  `;

  const grid = document.getElementById('itens-grid');
  cat.itens.forEach(item => {
    const abrirEsse = abrirItem && item.id === itemIdParaAbrir;
    const card = criarItemCard(item, { abrir: abrirEsse });
    grid.appendChild(card);
  });

  document.getElementById('btn-marcar-todos').addEventListener('click', () => {
    cat.itens.forEach(i => { marcarItem(i.id, true); });
    salvarJSON(K_STATE, estado);
    renderSidebar();
    renderMain();
  });

  document.getElementById('btn-reset-cat').addEventListener('click', () => {
    if(!confirm(`Reiniciar todos os itens de "${cat.nome}"?`)) return;
    cat.itens.forEach(i => { marcarItem(i.id, false); });
    salvarJSON(K_STATE, estado);
    renderSidebar();
    renderMain();
  });

  if(abrirItem && itemIdParaAbrir){
    const alvo = document.querySelector(`.item-card.aberto`);
    if(alvo) alvo.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

// ---------- Rotina de Hoje (lista única com todos os itens diários) ----------
function renderRotinaHoje(el){
  const itens = itensDiarios();
  const total = itens.length;
  const marcados = itens.filter(i => estaMarcado(i.id)).length;
  const pct = total ? Math.round((marcados/total)*100) : 0;
  const altasAbertas = itens.filter(i => i.crit === 'alta' && !estaMarcado(i.id)).length;
  const status = altasAbertas > 0 ? { classe:'critico', label:'🔴 Não Conforme' }
    : marcados < total ? { classe:'atencao', label:'🟡 Atenção' }
    : { classe:'ok', label:'🟢 Conforme' };
  const todosMarcados = marcados === total;

  el.innerHTML = `
    <div class="main-header">
      <div>
        <h2><span class="ic-inline">${svg('sun')}</span> Rotina de Hoje</h2>
        <div class="tags-row">
          <span class="cat-tag">Todos os itens diários, de todas as rotinas, em uma lista só</span>
          <span class="status-chip ${status.classe}">${status.label}</span>
        </div>
      </div>
      <div class="main-header-actions">
        <button class="btn-ghost primario" id="btn-marcar-todos-hoje">${svg('check-check')} ${todosMarcados ? 'Todos marcados' : 'Marcar Todos'}</button>
      </div>
    </div>

    <div class="resumo-bar">
      <div class="resumo-top">
        <div class="resumo-info"><b>${marcados}/${total}</b> itens conferidos hoje</div>
        <div class="resumo-info"><b>${pct}%</b></div>
      </div>
      <div class="progress-track"><div class="progress-fill ${pct===100?'full':''}" style="width:${pct}%"></div></div>
    </div>

    <div class="itens-grid" id="itens-grid-hoje"></div>
  `;

  const grid = document.getElementById('itens-grid-hoje');
  itens.forEach(item => grid.appendChild(criarItemCard(item)));

  document.getElementById('btn-marcar-todos-hoje').addEventListener('click', () => {
    itens.forEach(i => { marcarItem(i.id, true); });
    salvarJSON(K_STATE, estado);
    renderSidebar();
    renderMain();
  });
}

// ---------- Dashboard ----------

  const totalGeral = TODOS_ITENS.length;
  const marcadosGeral = TODOS_ITENS.filter(i => estaMarcado(i.id)).length;
  const pctGeral = totalGeral ? Math.round((marcadosGeral/totalGeral)*100) : 0;
  const ncAbertas = contarNaoConformidadesAbertas();

  el.innerHTML = `
    <div class="main-header">
      <div>
        <h2><span class="ic-inline">${svg('bar-chart')}</span> Visão Geral da Rotina</h2>
        <div class="tags-row"><span class="cat-tag">${new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' })}</span></div>
      </div>
      <div class="main-header-actions">
        <button class="btn-ghost perigo" id="btn-reset-tudo">${svg('trash-2')} Reiniciar Tudo</button>
      </div>
    </div>

    <div class="estab-card">
      <div class="estab-head"><span class="ic-inline">${svg('building2')}</span> Identificação do Estabelecimento</div>
      <div class="estab-grid">
        <div class="estab-campo">
          <label>Farmácia / Drogaria</label>
          <input type="text" id="estab-nome" placeholder="Nome do estabelecimento" value="${estabelecimento.nome || ''}">
        </div>
        <div class="estab-campo">
          <label>CNPJ</label>
          <input type="text" id="estab-cnpj" placeholder="00.000.000/0000-00" value="${estabelecimento.cnpj || ''}">
        </div>
        <div class="estab-campo">
          <label>Farmacêutico(a) Responsável Técnico</label>
          <input type="text" id="estab-rt" placeholder="Nome e CRF" value="${estabelecimento.rt || ''}">
        </div>
      </div>
      <div class="estab-nota">Preenchido automaticamente no cabeçalho do Relatório PDF. Salvo apenas neste navegador.</div>
    </div>

    <div class="dash-resumo-global">
      <h3>Conformidade geral de hoje</h3>
      <p>${marcadosGeral} de ${totalGeral} itens conferidos em todas as rotinas · ${ncAbertas} pendência(s) em aberto</p>
      <div class="progress-track"><div class="progress-fill" style="width:${pctGeral}%"></div></div>
    </div>

    <div class="dash-grid" id="dash-grid"></div>

    <div class="historico-box">
      <h3><span class="ic-inline">${svg('trending-up')}</span> Histórico da rotina diária</h3>
      <div class="spark-wrap">${sparklineSVG(historico)}</div>
      <div id="historico-lista"></div>
    </div>

    <div class="aviso-responsabilidade">
      <div class="aviso-titulo"><span class="ic-inline">${svg('alert-circle')}</span> Aviso de Uso</div>
      <p>Este checklist é uma <strong>ferramenta de apoio operacional</strong> para a rotina do farmacêutico responsável técnico e de sua equipe. Ele não substitui a leitura integral das normas citadas, que devem ser sempre consultadas em sua versão vigente e integral — use o painel <strong>"Fonte de Dados"</strong> no menu para acessá-las diretamente.</p>
      <p>Os dados marcados são armazenados <strong>apenas no navegador do dispositivo utilizado</strong> (armazenamento local), não havendo envio a servidores externos.</p>
    </div>

    <div class="versao-footer">Checklist de Rotina · FarmaPrática v1.2 · ${TODOS_ITENS.length} itens em ${DATA.categorias.length} rotinas · ${Object.keys(NORMAS).length} normas na base · normas verificadas em ${NORMAS_ATUALIZADO_EM}</div>
  `;

  ['estab-nome','estab-cnpj','estab-rt'].forEach(id => {
    document.getElementById(id).addEventListener('change', (e) => {
      const campo = id.replace('estab-','');
      estabelecimento[campo] = e.target.value;
      salvarJSON(K_EST, estabelecimento);
    });
  });

  const grid = document.getElementById('dash-grid');
  DATA.categorias.forEach(cat => {
    const { total, marcados } = contagemCategoria(cat);
    const pct = total ? Math.round((marcados/total)*100) : 0;
    const status = statusCategoria(cat);
    const card = document.createElement('div');
    card.className = 'dash-card';
    card.innerHTML = `
      <div class="dash-card-head"><span class="ic-inline">${svg(CAT_ICON[cat.id])}</span><span class="status-chip ${status.classe}">${status.label.split(' ')[0]}</span></div>
      <h4>${cat.nome}</h4>
      <div class="freq-tag">${DATA.freqIcon[cat.freq]} ${DATA.freqLabel[cat.freq]}</div>
      <div class="progress-track"><div class="progress-fill ${pct===100?'full':''}" style="width:${pct}%"></div></div>
      <div class="pct-row"><span>${marcados}/${total} itens</span><span>${pct}%</span></div>

    card.onclick = () => { categoriaAtual = cat.id; renderSidebar(); renderMain(); };

  } else {
    histEl.innerHTML = historico.map(h => {
      const d = new Date(h.data + 'T00:00:00');
      const label = d.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
      const cor = h.percentual === 100 ? 'var(--green)' : h.percentual >= 70 ? 'var(--amber)' : 'var(--red-bright)';
      return `<div class="historico-linha"><span class="hd">${label}</span><span class="hp" style="color:${cor}">${h.percentual}%</span></div>`;
    }).join('');
  }

  document.getElementById('btn-reset-tudo').addEventListener('click', reiniciarTudo);
}

function reiniciarTudo(){
  const confirmacao = confirm(
    'Reiniciar TODA a checklist de rotina?\n\n' +
    'Isso vai desmarcar todos os itens de todas as rotinas (diárias, semanais e mensais) ' +
    'e apagar as ocorrências registradas manualmente no painel de Não Conformidades.\n\n' +
    'O histórico de dias anteriores será mantido.\n\n' +
    'Esta ação não pode ser desfeita. Deseja continuar?'
  );
  if(!confirmacao) return;

  TODOS_ITENS.forEach(i => { marcarItem(i.id, false); });
  ncManual = [];
  salvarJSON(K_STATE, estado);
  salvarJSON(K_NC, ncManual);

  renderSidebar();
  renderMain();
}

// ---------- Painel de Não Conformidades ----------
function renderNaoConformidades(el){
  const autoAbertas = TODOS_ITENS.filter(i => (i.crit === 'alta' || i.crit === 'media') && !estaMarcado(i.id));

  el.innerHTML = `
    <div class="main-header">
      <div><h2><span class="ic-inline">${svg('alert-triangle')}</span> Painel de Não Conformidades</h2></div>
    </div>

    <div class="nc-sec-title">Pendências detectadas automaticamente (itens não conferidos)</div>
    <div class="nc-table-wrap">
      <table class="nc-table">
        <thead><tr><th>Ocorrência</th><th>Rotina</th><th>Gravidade</th><th>Status</th></tr></thead>
        <tbody id="nc-auto-body"></tbody>
      </table>
    </div>

    <div class="nc-sec-title">Registro manual de ocorrências</div>
    <div class="nc-form">
      <input type="text" id="nc-texto" placeholder="Descrever a ocorrência...">
      <select id="nc-gravidade">
        <option value="alta">Alta</option>
        <option value="media" selected>Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <button id="nc-add">Adicionar</button>
    </div>
    <div class="nc-table-wrap">
      <table class="nc-table">
        <thead><tr><th>Ocorrência</th><th>Gravidade</th><th>Status</th><th></th></tr></thead>
        <tbody id="nc-manual-body"></tbody>
      </table>
    </div>
  `;

  const autoBody = document.getElementById('nc-auto-body');
  if(autoAbertas.length === 0){
    autoBody.innerHTML = `<tr><td colspan="4" class="nc-empty">Nenhuma pendência crítica ou moderada em aberto. ✅</td></tr>`;
  } else {
    autoBody.innerHTML = autoAbertas.map(i => `
      <tr>
        <td>${i.texto}</td>
        <td><span class="ic-inline">${svg(CAT_ICON[i.catId])}</span> ${i.catNome}</td>
        <td><span class="grav-chip ${i.crit}">${i.crit === 'alta' ? 'Alta' : i.crit === 'media' ? 'Média' : 'Baixa'}</span></td>
        <td>Em aberto</td>
      </tr>
    `).join('');
  }

  function renderManual(){
    const body = document.getElementById('nc-manual-body');
    if(ncManual.length === 0){
      body.innerHTML = `<tr><td colspan="4" class="nc-empty">Nenhuma ocorrência registrada manualmente.</td></tr>`;
      return;
    }
    body.innerHTML = ncManual.map(n => `
      <tr>
        <td>${n.texto}</td>
        <td><span class="grav-chip ${n.gravidade}">${n.gravidade === 'alta' ? 'Alta' : n.gravidade === 'media' ? 'Média' : 'Baixa'}</span></td>
        <td>
          <select class="nc-status-select" data-id="${n.id}">
            <option ${n.status==='Aberta'?'selected':''}>Aberta</option>
            <option ${n.status==='Em análise'?'selected':''}>Em análise</option>
            <option ${n.status==='Resolvida'?'selected':''}>Resolvida</option>
          </select>
        </td>
        <td><button class="nc-del" data-id="${n.id}">✕</button></td>
      </tr>
    `).join('');
    body.querySelectorAll('.nc-status-select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const id = e.target.getAttribute('data-id');
        const item = ncManual.find(n => n.id === id);
        if(item){ item.status = e.target.value; salvarJSON(K_NC, ncManual); renderSidebar(); }
      });
    });
    body.querySelectorAll('.nc-del').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.target.getAttribute('data-id');
        ncManual = ncManual.filter(n => n.id !== id);
        salvarJSON(K_NC, ncManual);
        renderManual();
        renderSidebar();
      });
    });
  }
  renderManual();

  document.getElementById('nc-add').addEventListener('click', () => {
    const texto = document.getElementById('nc-texto').value.trim();
    if(!texto) return;
    const gravidade = document.getElementById('nc-gravidade').value;
    ncManual.unshift({ id: 'nc'+Date.now(), texto, gravidade, status: 'Aberta' });
    salvarJSON(K_NC, ncManual);
    document.getElementById('nc-texto').value = '';
    renderManual();
    renderSidebar();
  });
}

// ---------- Painel Fonte de Dados ----------
function renderFontesDados(el){
  const grupos = {};
  Object.keys(NORMAS).forEach(chave => {
    const n = NORMAS[chave];
    if(!grupos[n.tipo]) grupos[n.tipo] = [];
    grupos[n.tipo].push(n);
  });

  el.innerHTML = `
    <div class="main-header">
      <div>
        <h2><span class="ic-inline">${svg('book-open')}</span> Fonte de Dados</h2>
        <div class="tags-row">
          <span class="cat-tag">Consulta manual das normas utilizadas neste checklist</span>
          <span class="status-chip ok">${svg('check-check')} verificadas em ${NORMAS_ATUALIZADO_EM}</span>
        </div>
      </div>
    </div>
    <p style="font-size:.84rem; color:var(--text-gray); line-height:1.6; margin-bottom:22px;">
      Esta lista reúne todas as legislações, resoluções e normas citadas nos itens do checklist, com o órgão emissor e uma breve explicação de origem. Use os links para consultar o texto oficial e completo sempre que precisar — recomenda-se revisão periódica, já que normas sanitárias são atualizadas com frequência.
    </p>
    <div id="fontes-lista"></div>
  `;

  const listaEl = document.getElementById('fontes-lista');
  Object.keys(grupos).forEach(tipo => {
    const grupoDiv = document.createElement('div');
    grupoDiv.className = 'fonte-grupo';
    grupoDiv.innerHTML = `<h3>${tipo}</h3>`;
    grupos[tipo].forEach(n => {
      const item = document.createElement('div');
      item.className = 'fonte-item';
      item.innerHTML = `
        <div class="fi-main">
          <div class="fi-sigla">${n.tipo} ${n.numero} — ${n.orgao}</div>
          <div class="fi-titulo">${n.titulo}</div>
          <div class="fi-contexto">${n.contexto}</div>
        </div>
        <a class="fi-link" href="${n.link}" target="_blank" rel="noopener">Consultar ↗</a>
      `;
      grupoDiv.appendChild(item);
    });
    listaEl.appendChild(grupoDiv);
  });
}

function toggleMenuImprimir(){
  document.getElementById('menu-imprimir').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('dropdown-imprimir');
  if(dd && !dd.contains(e.target)){
    document.getElementById('menu-imprimir').classList.remove('open');
  }
});

function gerarRelatorioPDF(){
  document.getElementById('menu-imprimir').classList.remove('open');
  const agora = new Date();
  const emitidoEm = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

  const totalGeral = TODOS_ITENS.length;
  const marcadosGeral = TODOS_ITENS.filter(i => estaMarcado(i.id)).length;
  const pctGeral = totalGeral ? Math.round((marcadosGeral/totalGeral)*100) : 0;
  const naoConformesGeral = totalGeral - marcadosGeral;

  const rotuloCrit = { alta:'Alta', media:'Média', baixa:'Baixa' };
  const estabNome = estabelecimento.nome ? estabelecimento.nome : '______________________________';
  const estabCnpj = estabelecimento.cnpj ? ` (CNPJ: ${estabelecimento.cnpj})` : '';
  const estabRt = estabelecimento.rt ? estabelecimento.rt : '______________________________';

  let html = `
    <div class="rel-header">
      <div class="rel-brand">Farma<span>Prática</span> - Relatório de Checklist de Rotina</div>
      <div class="rel-meta">
        Relatório emitido em: <strong>${emitidoEm}</strong><br>
        Estabelecimento: <strong>${estabNome}</strong>${estabCnpj}<br>
        Responsável técnico: <strong>${estabRt}</strong>
      </div>
    </div>

    <div class="rel-resumo">
      <div class="rel-resumo-card"><div class="n">${totalGeral}</div><div class="l">Itens verificados</div></div>
      <div class="rel-resumo-card"><div class="n rel-ok">${marcadosGeral}</div><div class="l">Conformidades</div></div>
      <div class="rel-resumo-card"><div class="n rel-nok">${naoConformesGeral}</div><div class="l">Não conformidades</div></div>
      <div class="rel-resumo-card"><div class="n">${pctGeral}%</div><div class="l">Conformidade geral</div></div>
    </div>
  `;

  DATA.categorias.forEach(cat => {
    html += `<div class="rel-cat">
      <h3>${cat.icone} ${cat.nome}<span class="rel-freq">(${DATA.freqLabel[cat.freq]})</span></h3>
      <table class="rel-table">
        <thead><tr><th style="width:38%">Item</th><th style="width:10%">Criticidade</th><th style="width:14%">Status</th><th style="width:20%">Conferido em</th><th style="width:18%">Base legal</th></tr></thead>
        <tbody>`;
    cat.itens.forEach(item => {
      const ok = estaMarcado(item.id);
      const ts = estado[item.id] ? estado[item.id].ts : null;
      const normasTxt = (item.normas || []).map(k => NORMAS[k] ? (NORMAS[k].tipo + ' ' + NORMAS[k].numero) : '').join('; ');
      html += `<tr>
        <td>${item.texto}</td>
        <td class="rel-crit-${item.crit}">${rotuloCrit[item.crit]}</td>
        <td class="${ok ? 'rel-ok' : 'rel-nok'}">${ok ? '✔ Conforme' : '✘ Não conforme'}</td>
        <td>${ok ? dataHoraFormatada(ts) : '—'}</td>
        <td>${normasTxt}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });

  // Não conformidades automáticas
  const autoAbertas = TODOS_ITENS.filter(i => (i.crit === 'alta' || i.crit === 'media') && !estaMarcado(i.id));
  html += `<div class="rel-nc-section"><h3>🚨 Não Conformidades Detectadas (itens não conferidos)</h3>`;
  if(autoAbertas.length === 0){
    html += `<p style="font-size:.8rem;color:#444;">Nenhuma pendência de criticidade alta ou média em aberto no momento da emissão.</p>`;
  } else {
    html += `<table class="rel-table"><thead><tr><th>Ocorrência</th><th>Rotina</th><th>Gravidade</th></tr></thead><tbody>`;
    autoAbertas.forEach(i => {
      html += `<tr><td>${i.texto}</td><td>${i.catIcone} ${i.catNome}</td><td class="rel-crit-${i.crit}">${rotuloCrit[i.crit]}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  // Não conformidades manuais
  html += `<div class="rel-nc-section"><h3>📝 Ocorrências Registradas Manualmente</h3>`;
  if(ncManual.length === 0){
    html += `<p style="font-size:.8rem;color:#444;">Nenhuma ocorrência manual registrada.</p>`;
  } else {
    html += `<table class="rel-table"><thead><tr><th>Ocorrência</th><th>Gravidade</th><th>Status</th></tr></thead><tbody>`;
    ncManual.forEach(n => {
      html += `<tr><td>${n.texto}</td><td class="rel-crit-${n.gravidade}">${rotuloCrit[n.gravidade]}</td><td>${n.status}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += `
    <div class="rel-assinatura">
      <div class="rel-assin-campo">
        <div class="rel-assin-linha"></div>
        <div class="rel-assin-label">Assinatura do Farmacêutico Responsável Técnico${estabelecimento.rt ? ' — ' + estabelecimento.rt : ''}</div>
      </div>
      <div class="rel-assin-campo">
        <div class="rel-assin-linha"></div>
        <div class="rel-assin-label">Data</div>
      </div>
    </div>
  `;

  html += `<div class="rel-footer">
    Relatório gerado automaticamente pela ferramenta de Checklist de Rotina do FarmaPrática. As datas de conferência refletem o último registro salvo no navegador utilizado; itens diários, semanais e mensais são reiniciados automaticamente ao final de cada período. Este documento é um instrumento de apoio interno e não substitui os registros oficiais exigidos pela legislação sanitária vigente nem a consulta ao texto integral e atualizado de cada norma (disponível no painel "Fonte de Dados").
  </div>`;

  document.getElementById('relatorio-impressao').innerHTML = html;
  window.print();
}

  document.getElementById('relatorio-impressao').innerHTML = html;

}
