<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmaPrática | Exames Laboratoriais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #5a5f66;
    --panel: #4a4e55;
    --sidebar: #454951;
    --card: #4f545c;
    --card-hover: #585d65;
    --border: #63686f;
    --red-dark: #a10f1f;
    --red: #e4172c;
    --red-bright: #ef5b6b;
    --red-glow: rgba(228,23,44,.22);
    --text: #f5f5f4;
    --text-dim: #a7abb1;
    --text-gray: #d2d5d9;
    --amber: #f59e0b;
    --green-ok: #3fb87f;
    --sidebar-w: 320px;
    --hover-tint: #585d65;

    --cat-red:#ef5b76;        --cat-red-glow:rgba(239,91,118,.22);
    --cat-blue:#4fa3e3;       --cat-blue-glow:rgba(79,163,227,.22);
    --cat-purple:#b98cf0;     --cat-purple-glow:rgba(185,140,240,.22);
    --cat-amber:#f59e0b;      --cat-amber-glow:rgba(245,158,11,.22);
    --cat-green:#3fb87f;      --cat-green-glow:rgba(63,184,127,.22);
    --cat-sky:#38bdf8;        --cat-sky-glow:rgba(56,189,248,.22);
    --cat-crimson:#f43f5e;    --cat-crimson-glow:rgba(244,63,94,.22);
    --cat-orange:#e8823c;     --cat-orange-glow:rgba(232,130,60,.22);
    --cat-cyan:#22d3ee;       --cat-cyan-glow:rgba(34,211,238,.22);
    --cat-teal:#14b8a6;       --cat-teal-glow:rgba(20,184,166,.22);
    --cat-indigo:#8b8ff5;     --cat-indigo-glow:rgba(139,143,245,.22);
    --cat-lime:#a3e635;       --cat-lime-glow:rgba(163,230,53,.22);
    --cat-magenta:#ef70ad;    --cat-magenta-glow:rgba(239,112,173,.22);
    --cat-yellow:#eab308;     --cat-yellow-glow:rgba(234,179,8,.22);
    --cat-brown:#b08968;      --cat-brown-glow:rgba(176,137,104,.22);
    --cat-petrol:#0891b2;     --cat-petrol-glow:rgba(8,145,178,.22);
    --cat-slate:#94a3b8;      --cat-slate-glow:rgba(148,163,184,.22);
    --cat-gray:#9aa1ab;       --cat-gray-glow:rgba(154,161,171,.20);
  }
  body.light{
    --bg: #eceef1;
    --panel: #f6f7f9;
    --sidebar: #e2e5e9;
    --card: #ffffff;
    --card-hover: #f1f2f5;
    --border: #d7dade;
    --red-dark: #a10f1f;
    --red: #d4152a;
    --red-bright: #eb374b;
    --red-glow: rgba(212,21,42,.14);
    --text: #22262c;
    --text-dim: #767c84;
    --text-gray: #4b5057;
    --amber: #c9790a;
    --green-ok: #1f8a53;
    --hover-tint: #eceef1;

    --cat-red:#d43a5c;        --cat-red-glow:rgba(212,58,92,.15);
    --cat-blue:#1c6dbf;       --cat-blue-glow:rgba(28,109,191,.15);
    --cat-purple:#7c3aed;     --cat-purple-glow:rgba(124,58,237,.15);
    --cat-amber:#c9790a;      --cat-amber-glow:rgba(201,121,10,.15);
    --cat-green:#1f8a53;      --cat-green-glow:rgba(31,138,83,.15);
    --cat-sky:#0284c7;        --cat-sky-glow:rgba(2,132,199,.15);
    --cat-crimson:#be123c;    --cat-crimson-glow:rgba(190,18,60,.15);
    --cat-orange:#c2600d;     --cat-orange-glow:rgba(194,96,13,.15);
    --cat-cyan:#0e7490;       --cat-cyan-glow:rgba(14,116,144,.15);
    --cat-teal:#0f766e;       --cat-teal-glow:rgba(15,118,110,.15);
    --cat-indigo:#4f46d0;     --cat-indigo-glow:rgba(79,70,208,.15);
    --cat-lime:#65a30d;       --cat-lime-glow:rgba(101,163,13,.15);
    --cat-magenta:#c23576;    --cat-magenta-glow:rgba(194,53,118,.15);
    --cat-yellow:#a16207;     --cat-yellow-glow:rgba(161,98,7,.15);
    --cat-brown:#8b5e34;      --cat-brown-glow:rgba(139,94,52,.15);
    --cat-petrol:#155e75;     --cat-petrol-glow:rgba(21,94,117,.15);
    --cat-slate:#475569;      --cat-slate-glow:rgba(71,85,105,.15);
    --cat-gray:#656c76;       --cat-gray-glow:rgba(101,108,118,.13);
  }
  body.light .theme-toggle .icon-sun{ display:none; }
  body.light .theme-toggle .icon-moon{ display:block; }
  body.light{ background: var(--bg) !important; }
  * { box-sizing: border-box; }
  button, input, select, textarea { font-family: inherit; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(239,91,107,.045), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(245,158,11,.025), transparent 55%),
      var(--bg);
    color: var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    transition: background-color .2s ease, color .2s ease;
  }
  a{ color:inherit; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:20px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- Topbar ---------- */
  .topbar-app{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display:grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    align-items:center;
    min-height:84px;
    flex-shrink:0;
    padding:20px 40px 20px 0;
    background: linear-gradient(120deg, var(--sidebar), var(--panel) 140%);
    border-bottom:2px solid rgba(228,23,44,.35);
    position:relative;
    box-shadow: 0 2px 24px rgba(0,0,0,.2);
    z-index:3;
  }
  .topbar-home-mobile{ display:none; }
  .sidebar-close-mobile{ display:none; }
  .logo-wrap{ grid-column:1; display:flex; align-items:center; padding-left:40px; }
  .logo-wrap a{ display:flex; align-items:center; text-decoration:none; color:inherit; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand img{ width:44px; height:44px; }
  .brand-text h1{ font-size:21px; font-weight:800; letter-spacing:-.3px; line-height:1.1; margin:0; color:var(--text); }
  .brand-text h1 span{ color:var(--red); }
  .brand-text p{ font-size:11px; color:var(--text-gray); font-weight:400; margin:2px 0 0; white-space:nowrap; }
  .titulo-central{ grid-column:2; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 12px; }
  .titulo-principal{ font-size:1.15rem; font-weight:800; letter-spacing:.3px; max-width:100%; line-height:1.25; display:flex; align-items:center; gap:8px; }
  .titulo-principal svg{ width:20px; height:20px; color:var(--red-bright); flex-shrink:0; }
  .titulo-descricao{ font-size:.76rem; color:var(--text-dim); margin-top:3px; max-width:560px; }
  .topbar-actions{ position:absolute; right:40px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .theme-toggle{ display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; transition:background-color .15s ease,border-color .15s ease; flex-shrink:0; }
  .theme-toggle:hover{ background:var(--hover-tint); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:none; }
  .balcao-toggle{
    display:flex; align-items:center; gap:7px; height:38px; padding:0 14px; border-radius:9px;
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; cursor:pointer;
    white-space:nowrap; transition:background-color .15s ease,border-color .15s ease,color .15s ease;
  }
  .balcao-toggle svg{ width:16px; height:16px; flex-shrink:0; }
  .balcao-toggle:hover{ background:var(--hover-tint); color:var(--text); }
  .balcao-toggle.active{ background: rgba(245,158,11,.14); border-color:var(--amber); color:var(--amber); }
  @media (max-width:980px){ .balcao-toggle .bl-label{ display:none; } .balcao-toggle{ padding:0 9px; } .topbar-actions{ right:14px; gap:6px; } }

  .app-body{ display:flex; flex:1; min-height:0; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    font-family:'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    width:var(--sidebar-w); flex-shrink:0;
    background: linear-gradient(180deg, var(--sidebar), var(--bg) 130%);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100%;
    box-shadow: 4px 0 28px rgba(0,0,0,.18);
    z-index:2;
  }
  .sidebar-header{ padding:14px 16px 10px; display:flex; flex-direction:column; gap:9px; }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:8px 10px; transition:border-color .15s ease, box-shadow .15s ease; }
  .search-box:focus-within{ border-color:var(--red-bright); box-shadow:0 0 0 3px var(--red-glow); }
  .search-box svg{ width:16px; height:16px; color:var(--text-dim); flex-shrink:0; }
  .search-box input{ background:transparent; border:none; outline:none; color:var(--text); font-size:.83rem; width:100%; font-family:'Manrope',sans-serif; }
  .clear-btn{ display:none; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; flex-shrink:0; background:var(--hover-tint); border:none; color:var(--text-dim); font-size:.7rem; cursor:pointer; line-height:1; padding:0; }
  .clear-btn.visivel{ display:flex; }
  .clear-btn:hover{ background:var(--red-bright); color:#fff; }
  .qtabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .qtab{
    display:flex; align-items:center; justify-content:center; gap:5px; font-size:.68rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.3px; padding:8px 6px; border-radius:9px; border:1px solid var(--border);
    background:linear-gradient(180deg, var(--card-hover), var(--panel)); color:var(--text-dim); cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, color .12s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 3px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.16);
  }
  .qtab svg{ width:13px; height:13px; }
  .qtab:hover{ color:var(--text); transform:translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 3px rgba(0,0,0,.1), 0 5px 10px rgba(0,0,0,.2); }
  .qtab:active{ transform:translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,.25); }
  .qtab.active{ background:linear-gradient(180deg,var(--red),var(--red-dark)); color:#fff; border-color:transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 4px rgba(0,0,0,.25), 0 3px 9px var(--red-glow); }
  .qtab.active:hover{ transform:translateY(-1px); }

  .sidebar-list{ flex:1; overflow-y:auto; padding:6px 10px 20px; }
  .pinned-group{ margin:6px 0 14px; }
  .pinned-head{ display:flex; align-items:center; gap:7px; font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--amber); padding:4px 4px 8px; }
  .pinned-head svg{ width:14px; height:14px; }
  .exam-chip-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .exam-chip{
    display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 8px; border-radius:9px;
    background:linear-gradient(180deg, var(--card-hover), var(--panel)); border:1px solid var(--border);
    font-size:.71rem; font-weight:700; color:var(--text-gray); cursor:pointer; text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, color .12s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 3px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.16);
  }
  .exam-chip:hover{ border-color:var(--red-bright); color:var(--text); transform:translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -2px 3px rgba(0,0,0,.08), 0 5px 10px rgba(0,0,0,.2); }
  .exam-chip:active{ transform:translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,.22); }
  .exam-chip.active{ background:linear-gradient(180deg,var(--red),var(--red-dark)); color:#fff; border-color:transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -2px 4px rgba(0,0,0,.25), 0 3px 9px var(--red-glow); }

  .cat-header{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:linear-gradient(180deg, var(--card-hover), var(--panel)); border:1px solid var(--border); border-left:3px solid var(--cc, var(--red-bright));
    border-radius:9px; padding:9px 11px; margin:8px 0 5px; cursor:pointer;
    font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; font-weight:800; color:var(--text-gray);
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 3px rgba(0,0,0,.1), 0 2px 5px rgba(0,0,0,.18);
  }
  .cat-header:hover{ transform:translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -2px 3px rgba(0,0,0,.08), 0 5px 11px rgba(0,0,0,.22); }
  .cat-header:active{ transform:translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,.22); }
  .cat-header.aberto{ box-shadow: inset 0 2px 5px rgba(0,0,0,.2), 0 1px 2px rgba(0,0,0,.1); }
  .cat-header .cat-nome{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--cc, var(--text-gray)); }
  .cat-header .cat-count{ font-size:.64rem; font-weight:700; background:var(--cg, var(--hover-tint)); color:var(--cc, var(--text-dim)); padding:2px 8px; border-radius:20px; flex-shrink:0; }
  .cat-header .cat-chevron{ flex-shrink:0; width:13px; height:13px; transition:transform .2s ease; opacity:.75; color:var(--cc,var(--text-dim)); }
  .cat-header.aberto .cat-chevron{ transform:rotate(90deg); }
  .cat-body{ display:none; padding:2px 0 8px 4px; }
  .cat-body.aberto{ display:block; }
  .cat-body-empty{ font-size:.72rem; color:var(--text-dim); padding:6px 10px 10px; font-style:italic; }
  .cat-grupo-titulo{ font-size:.63rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); padding:8px 8px 3px; }
  .exam-item{ display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:8px; cursor:pointer; transition:.12s ease; }
  .exam-item:hover{ background:var(--card-hover); }
  .exam-item.active{ background: var(--cg, var(--red-glow)); }
  .exam-item .item-dot{ width:6px; height:6px; border-radius:50%; background:var(--cc, var(--red-bright)); flex-shrink:0; }
  .exam-item .item-nome{ flex:1; min-width:0; font-size:.79rem; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .exam-item .item-sigla{ font-size:.66rem; color:var(--text-dim); flex-shrink:0; }
  .fav-star{ flex-shrink:0; width:15px; height:15px; cursor:pointer; color:var(--text-dim); }
  .fav-star.on{ color:var(--amber); }
  .fav-star:hover{ color:var(--amber); }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; overflow-y:auto; padding:28px 34px 60px; }
  .breadcrumb{ font-size:.76rem; color:var(--text-dim); margin-bottom:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .breadcrumb a{ color:var(--text-dim); text-decoration:none; cursor:pointer; }
  .breadcrumb a:hover{ color:var(--red-bright); text-decoration:underline; }

  /* Home / dashboard */
  .home-hero{ margin-bottom:26px; }
  .home-hero h2{ font-family:'Inter',sans-serif; font-size:1.7rem; font-weight:800; margin:0 0 6px; display:flex; align-items:center; gap:10px; }
  .home-hero h2 svg{ width:30px; height:30px; flex-shrink:0; color:var(--red-bright); }
  .home-hero h2 .brand-word span{ color:var(--red); }
  .home-hero p{ margin:0; color:var(--text-dim); font-size:.92rem; max-width:640px; }
  .intro-banner{ display:flex; align-items:flex-start; gap:14px; background:linear-gradient(120deg, var(--card), var(--panel)); border:1px solid var(--border); border-left:4px solid var(--red-bright); border-radius:14px; padding:16px 20px; margin-bottom:26px; box-shadow:0 4px 18px rgba(0,0,0,.12); }
  .intro-banner-icon{ width:38px; height:38px; border-radius:11px; background:var(--red-glow); color:var(--red-bright); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .intro-banner-icon svg{ width:20px; height:20px; }
  .intro-banner p{ margin:0; font-size:.9rem; color:var(--text-gray); line-height:1.6; }
  .home-search-big{ margin-top:18px; max-width:640px; }
  .home-search-big .search-box{ padding:13px 16px; border-radius:13px; }
  .home-search-big .search-box input{ font-size:.95rem; }
  .section-title{ font-family:'Inter',sans-serif; font-size:.85rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-gray); margin:30px 0 12px; display:flex; align-items:center; gap:8px; }
  .section-title svg{ width:16px; height:16px; color:var(--red-bright); }

  .tiles-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  .cat-tile{
    background:var(--card); border:1px solid var(--border); border-top:3px solid var(--cc, var(--red-bright));
    border-radius:12px; padding:14px 14px 12px; cursor:pointer; transition:.15s ease; text-align:left;
    display:flex; flex-direction:column; gap:8px;
  }
  .cat-tile:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.18); border-color:var(--cc); }
  .cat-tile .ct-icon{ width:30px; height:30px; border-radius:9px; background:var(--cg, var(--hover-tint)); color:var(--cc, var(--red-bright)); display:flex; align-items:center; justify-content:center; }
  .cat-tile .ct-icon svg{ width:16px; height:16px; }
  .cat-tile h4{ margin:0; font-size:.86rem; font-weight:700; font-family:'Inter',sans-serif; }
  .cat-tile .ct-count{ font-size:.68rem; color:var(--text-dim); }

  .quick-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .quick-card{ display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--border); border-radius:11px; padding:11px 12px; cursor:pointer; transition:.14s ease; }
  .quick-card:hover{ border-color:var(--red-bright); transform:translateY(-2px); }
  .quick-card .qc-dot{ width:9px; height:9px; border-radius:50%; background:var(--cc,var(--red-bright)); flex-shrink:0; }
  .quick-card span{ font-size:.8rem; font-weight:700; }

  .empty-hint{ display:flex; align-items:flex-start; gap:10px; font-size:.85rem; color:var(--text-dim); background:var(--card); border:1px dashed var(--border); border-radius:10px; padding:16px; }
  .empty-hint svg{ width:18px; height:18px; flex-shrink:0; margin-top:1px; }
  .empty-hint a{ color:var(--red-bright); font-weight:700; cursor:pointer; text-decoration:underline; }

  /* Exam detail */
  .exam-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .exam-head h2{ font-family:'Inter',sans-serif; font-size:1.55rem; font-weight:800; margin:0 0 6px; }
  .exam-head .sigla-badge{ font-size:.85rem; font-weight:700; color:var(--cc, var(--red-bright)); background:var(--cg, var(--red-glow)); padding:2px 10px; border-radius:20px; margin-left:8px; vertical-align:middle; }
  .exam-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .exam-chips .chip{ font-size:.72rem; font-weight:700; color:var(--text-dim); background:var(--panel); border:1px solid var(--border); padding:4px 11px; border-radius:20px; }
  .exam-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .btn-fav{ display:flex; align-items:center; gap:6px; padding:9px 15px; border-radius:9px; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); font-size:.76rem; font-weight:700; cursor:pointer; }
  .btn-fav svg{ width:15px; height:15px; }
  .btn-fav.on{ background:rgba(245,158,11,.14); border-color:var(--amber); color:var(--amber); }
  .sinonimos-line{ font-size:.78rem; color:var(--text-dim); margin-top:8px; }

  .indicadores-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px 0 6px; }
  .indicador{ background:var(--card); border:1px solid var(--border); border-radius:11px; padding:10px 12px; }
  .indicador .ind-label{ font-size:.62rem; text-transform:uppercase; letter-spacing:.4px; color:var(--text-dim); font-weight:800; }

/* ---------------- Busca ---------------- */
function normaliza(s){ return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function calculadorasIndex(){
  return [
    {id:'tfg', nome:'TFG estimada (CKD-EPI / Cockcroft-Gault)', kw:'tfg egfr clearance creatinina filtracao glomerular funcao renal'},
    {id:'ldlcalc', nome:'LDL calculado (Friedewald)', kw:'ldl colesterol friedewald calculo'},
    {id:'rac', nome:'Relação Albumina/Creatinina urinária', kw:'albuminuria microalbuminuria rac relacao albumina creatinina urinaria'}
  ];
}
function buscaGlobal(q){
  const nq = normaliza(q);
  if(!nq) return {exames:[], calcs:[], termos:[]};
  const exames = DATA.exames.filter(e=>{
    const campos = [e.nome, e.sigla, (e.sinonimos||[]).join(' '), e.sistema, e.grupo,
      getCategoria(e.categoria)?.nome,
      (e.condicoesClinicas?.aumentado||[]).join(' '), (e.condicoesClinicas?.reduzido||[]).join(' '),
      (e.medicamentos?.aumentam||[]).join(' '), (e.medicamentos?.reduzem||[]).join(' '), (e.medicamentos?.interferem||[]).join(' '),
      (e.correlatosTexto||[]).join(' ')];
    return campos.some(c=>normaliza(c).includes(nq));
  }).sort((a,b)=>{
    const an = normaliza(a.nome).startsWith(nq) || normaliza(a.sigla).startsWith(nq);
    const bn = normaliza(b.nome).startsWith(nq) || normaliza(b.sigla).startsWith(nq);
    return (bn?1:0)-(an?1:0);
  });
  const calcs = calculadorasIndex().filter(c=>normaliza(c.kw).includes(nq) || normaliza(c.nome).includes(nq));
  const termos = DATA.glossario.filter(g=>normaliza(g.termo).includes(nq) || normaliza(g.definicao).includes(nq));
  return {exames, calcs, termos};
}

/* ---------------- Render: Sidebar ---------------- */
function renderSidebar(){
  const el = document.getElementById('sidebar-list');
  if(state.search){
    const r = buscaGlobal(state.search);
    let html = '';
    if(r.exames.length===0 && r.calcs.length===0 && r.termos.length===0){
      html += '<div class="cat-body-empty">Nenhum resultado para "'+state.search+'".</div>';
    }
    if(r.exames.length){
      html += '<div class="pinned-head">'+icon('star')+' Exames ('+r.exames.length+')</div>';
      html += r.exames.map(e=>examItemHTML(e)).join('');
    }
    if(r.calcs.length){
      html += '<div class="pinned-head" style="margin-top:14px">'+icon('activity')+' Calculadoras</div>';
      html += r.calcs.map(c=>'<div class="exam-item" onclick="setView(\'calculadoras\')"><span class="item-dot"></span><span class="item-nome">'+c.nome+'</span></div>').join('');
    }
    if(r.termos.length){
      html += '<div class="pinned-head" style="margin-top:14px">'+icon('more')+' Glossário</div>';
      html += r.termos.map(t=>'<div class="exam-item" onclick="setView(\'glossario\')"><span class="item-dot"></span><span class="item-nome">'+t.termo+'</span></div>').join('');
    }
    el.innerHTML = html;
    return;
  }
  let html = '';
  const favExames = [...favoritos].map(id=>getExame(id)).filter(Boolean).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  html += '<div class="pinned-group">';
  html += '<div class="pinned-head">'+icon('star')+' Favoritos</div>';
  if(favExames.length){
    html += '<div class="exam-chip-grid">'+favExames.map(e=>'<button class="exam-chip'+(state.exameId===e.id?' active':'')+'" onclick="abrirExame(\''+e.id+'\')">'+e.sigla+'</button>').join('')+'</div>';
  } else {
    html += '<div class="cat-body-empty" style="padding:0 4px">Nenhum favorito ainda. Toque na estrela ao lado de um exame para adicioná-lo aqui.</div>';
  }
  html += '</div>';
  DATA.categorias.forEach(cat=>{
    const exs = examesDaCategoria(cat.id);
    const aberto = state.openCats.has(cat.id);
    html += '<button class="cat-header'+(aberto?' aberto':'')+'" '+ccStyle(cat.cor)+' onclick="toggleCategoria(\''+cat.id+'\')">';
    html += '<span class="cat-nome">'+cat.nome+'</span><span class="cat-count">'+exs.length+'</span>'+icon('chev','cat-chevron');
    html += '</button>';
    html += '<div class="cat-body'+(aberto?' aberto':'')+'">';
    if(exs.length===0){
      html += '<div class="cat-body-empty">Nenhum exame cadastrado ainda nesta categoria.</div>';
    } else {
      const grupos = [...new Set(exs.map(e=>e.grupo||''))];
      grupos.forEach(g=>{
        if(g) html += '<div class="cat-grupo-titulo">'+g+'</div>';
        exs.filter(e=>(e.grupo||'')===g).forEach(e=>{ html += examItemHTML(e); });
      });
    }
    html += '</div>';
  });
  el.innerHTML = html;
}

/* ---------------- Comparador ---------------- */
function comparadorHTML(e){
  const pontos = comparadorData[e.id] || [];
  let html = '<h5>Registrar novo resultado</h5>';
  html += '<div class="comp-form">'+
    '<input type="date" id="comp-data">'+
    '<input type="number" step="any" id="comp-valor" placeholder="Valor">'+
    '<input type="text" id="comp-unidade" placeholder="Unidade" value="'+e.valoresReferencia[0].unidade+'">'+
    '<input type="text" id="comp-lab" placeholder="Laboratório (opcional)">'+
    '<button onclick="addComparador(\''+e.id+'\')">Adicionar</button>'+
  '</div>';
  if(!pontos.length){
    html += '<div class="comp-empty">Nenhum resultado registrado ainda para este exame. Adicione resultados anteriores para visualizar a evolução ao longo do tempo.</div>';
  } else {
    const ordenados = [...pontos].sort((a,b)=>a.data.localeCompare(b.data));
    html += sparklineSVG(ordenados);
    html += '<table class="comp-table"><thead><tr><th>Data</th><th>Resultado</th><th>Laboratório</th><th></th></tr></thead><tbody>'+
      ordenados.map((p,i)=>'<tr><td>'+formatData(p.data)+'</td><td>'+p.valor+' '+p.unidade+'</td><td>'+(p.lab||'-')+'</td><td class="del-row" onclick="removeComparador(\''+e.id+'\','+i+')">✕ remover</td></tr>').join('')+
    '</tbody></table>';
  }
  html += '<div class="ref-disclaimer">'+icon('alert')+' A tendência exibida é apenas uma visualização dos resultados informados. Não constitui, isoladamente, diagnóstico ou interpretação clínica automática.</div>';
  return html;
}
function formatData(iso){ const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function sparklineSVG(pontos){
  if(pontos.length<2){
    const trend = '<span class="trend-chip trend-flat">• Ponto único</span>';
    return '<div style="margin-bottom:12px">'+trend+'</div>';
  }
  const vals = pontos.map(p=>parseFloat(p.valor));
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const w = 560, h = 90, pad=10;
  const pts = vals.map((v,i)=>{
    const x = pad + (i*(w-2*pad)/(vals.length-1));
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return x+','+y;
  }).join(' ');
  const last = vals[vals.length-1], prev = vals[vals.length-2];
  let trendClass='trend-flat', trendLabel='→ Estável';
  if(last>prev*1.03){ trendClass='trend-up'; trendLabel='↗ Aumento'; }
  else if(last<prev*0.97){ trendClass='trend-down'; trendLabel='↘ Redução'; }
  let svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="margin-bottom:6px">';
  svg += '<polyline points="'+pts+'" fill="none" stroke="var(--red-bright)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  vals.forEach((v,i)=>{ const [x,y]=pts.split(' ')[i].split(','); svg += '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--red-bright)"/>'; });
  svg += '</svg>';
  return '<div style="margin-bottom:6px">'+svg+'</div><div style="margin-bottom:12px"><span class="trend-chip '+trendClass+'">'+trendLabel+'</span></div>';
}
function addComparador(examId){
  const data = document.getElementById('comp-data').value;
  const valor = document.getElementById('comp-valor').value;
  const unidade = document.getElementById('comp-unidade').value;
  const lab = document.getElementById('comp-lab').value;
  if(!data || valor===''){ alert('Informe ao menos a data e o valor do resultado.'); return; }
  if(!comparadorData[examId]) comparadorData[examId]=[];
  comparadorData[examId].push({data, valor:parseFloat(valor), unidade, lab});
  saveComparador();
  renderMain();
  setTab('comp');
}
function removeComparador(examId, idx){
  const ordenados = [...comparadorData[examId]].sort((a,b)=>a.data.localeCompare(b.data));
  const alvo = ordenados[idx];
  comparadorData[examId] = comparadorData[examId].filter(p=>p!==alvo);
  saveComparador();
  renderMain();
  setTab('comp');
}

/* ---------------- Calculadoras ---------------- */
function renderCalculadoras(){
  let html = '<button class="btn-voltar-mobile" onclick="setView(\'inicio\')">'+icon('back')+' Voltar</button>';
  html += '<div class="home-hero"><h2>'+icon('activity')+' Calculadoras</h2><p>Ferramentas de apoio ao cálculo de parâmetros laboratoriais derivados. Sempre avalie o resultado dentro do contexto clínico do paciente.</p></div>';
  html += '<div class="calc-grid">';

  html += '<div class="calc-card"><h4>TFG estimada (função renal)</h4>'+
    '<div class="calc-formula">CKD-EPI 2021 (sem raça) · Cockcroft-Gault</div>'+
    '<div class="calc-field"><label>Sexo</label><select id="tfg-sexo"><option value="F">Feminino</option><option value="M">Masculino</option></select></div>'+
    '<div class="calc-field"><label>Idade (anos)</label><input type="number" id="tfg-idade" placeholder="Ex.: 55"></div>'+
    '<div class="calc-field"><label>Creatinina sérica (mg/dL)</label><input type="number" step="0.01" id="tfg-creat" placeholder="Ex.: 1.1"></div>'+
    '<div class="calc-field"><label>Peso (kg): usado apenas no Cockcroft-Gault</label><input type="number" id="tfg-peso" placeholder="Ex.: 70"></div>'+
    '<button class="calc-btn" onclick="calcularTFG()">Calcular</button>'+
    '<div class="calc-result" id="tfg-result"></div>'+
    '<div class="calc-limit">Fórmulas estimativas. Não substituem clearance medido diretamente (ex.: urina de 24h) em situações de massa muscular extrema, amputações, gestação ou função renal rapidamente variável.</div>'+
  '</div>';

  html += '<div class="calc-card"><h4>LDL calculado (Friedewald)</h4>'+
    '<div class="calc-formula">LDL = CT − HDL − (TG / 5)  [mg/dL]</div>'+
    '<div class="calc-field"><label>Colesterol Total (mg/dL)</label><input type="number" id="ldl-ct" placeholder="Ex.: 210"></div>'+
    '<div class="calc-field"><label>HDL (mg/dL)</label><input type="number" id="ldl-hdl" placeholder="Ex.: 45"></div>'+
    '<div class="calc-field"><label>Triglicerídeos (mg/dL)</label><input type="number" id="ldl-tg" placeholder="Ex.: 130"></div>'+
    '<button class="calc-btn" onclick="calcularLDL()">Calcular</button>'+
    '<div class="calc-result" id="ldl-result"></div>'+
    '<div class="calc-limit">Válida apenas para triglicerídeos abaixo de 400 mg/dL. Acima disso, a fórmula perde precisão. Utilize a dosagem direta do LDL.</div>'+
  '</div>';

  html += '<div class="calc-card"><h4>Relação Albumina/Creatinina urinária</h4>'+
    '<div class="calc-formula">RAC (mg/g) = Albumina (mg/L) × 100 / Creatinina urinária (mg/dL)</div>'+
    '<div class="calc-field"><label>Albumina urinária (mg/L)</label><input type="number" id="rac-alb" placeholder="Ex.: 25"></div>'+
    '<div class="calc-field"><label>Creatinina urinária (mg/dL)</label><input type="number" id="rac-creat" placeholder="Ex.: 80"></div>'+
    '<button class="calc-btn" onclick="calcularRAC()">Calcular</button>'+
    '<div class="calc-result" id="rac-result"></div>'+
    '<div class="calc-limit">Classificação KDIGO: A1 &lt;30 mg/g (normal/levemente aumentada), A2 30–300 mg/g (moderadamente aumentada), A3 &gt;300 mg/g (gravemente aumentada). Confirmar com 2ª amostra antes de conclusões.</div>'+
  '</div>';

  html += '</div>';
  return html;
}
function wireCalculadoras(){}
function calcularTFG(){
  const sexo = document.getElementById('tfg-sexo').value;
  const idade = parseFloat(document.getElementById('tfg-idade').value);
  const creat = parseFloat(document.getElementById('tfg-creat').value);
  const peso = parseFloat(document.getElementById('tfg-peso').value);
  const box = document.getElementById('tfg-result');
  if(!idade || !creat){ box.classList.remove('show'); alert('Informe idade e creatinina.'); return; }
  let k = sexo==='F'?0.7:0.9, a = sexo==='F'?-0.241:-0.302, mult = sexo==='F'?1.012:1;
  const ratio = creat/k;
  const expo = ratio<=1 ? a : -1.2;
  const ckdepi = 142 * Math.pow(ratio, expo) * Math.pow(0.9938, idade) * mult;
  let estagio = 'G1 (≥90, normal ou alta)';
  if(ckdepi<15) estagio='G5 (<15, falência renal)';
  else if(ckdepi<30) estagio='G4 (15–29, redução grave)';
  else if(ckdepi<45) estagio='G3b (30–44, redução moderada-grave)';
  else if(ckdepi<60) estagio='G3a (45–59, redução leve-moderada)';
  else if(ckdepi<90) estagio='G2 (60–89, redução leve)';
  let html = '<div class="cr-valor">'+ckdepi.toFixed(1)+'</div><div class="cr-unidade">mL/min/1,73m² (CKD-EPI 2021)</div>'+
    '<div class="cr-interp">Categoria KDIGO estimada: <b>'+estagio+'</b></div>';
  if(peso){
    const cg = ((140-idade)*peso)/(72*creat) * (sexo==='F'?0.85:1);
    html += '<div class="cr-interp">Cockcroft-Gault: <b>'+cg.toFixed(1)+' mL/min</b> (clearance de creatinina estimado, não normalizado por superfície corporal)</div>';
  }
  box.innerHTML = html; box.classList.add('show');
}
function calcularLDL(){
  const ct = parseFloat(document.getElementById('ldl-ct').value);
  const hdl = parseFloat(document.getElementById('ldl-hdl').value);
  const tg = parseFloat(document.getElementById('ldl-tg').value);
  const box = document.getElementById('ldl-result');
  if(!ct || !hdl || !tg){ alert('Preencha os três valores.'); return; }
  if(tg>=400){
    box.innerHTML = '<div class="cr-interp">'+icon('alert')+' Triglicerídeos ≥ 400 mg/dL: a fórmula de Friedewald não é confiável. Solicite a dosagem direta do LDL.</div>';
    box.classList.add('show'); return;
  }
  const ldl = ct - hdl - (tg/5);
  let cat='Ótimo (<100)';
  if(ldl>=190) cat='Muito alto (≥190)'; else if(ldl>=160) cat='Alto (160–189)'; else if(ldl>=130) cat='Limítrofe (130–159)'; else if(ldl>=100) cat='Próximo do ótimo (100–129)';
  box.innerHTML = '<div class="cr-valor">'+ldl.toFixed(1)+'</div><div class="cr-unidade">mg/dL</div><div class="cr-interp">Categoria: <b>'+cat+'</b>. A meta terapêutica deve ser individualizada pelo risco cardiovascular do paciente.</div>';
  box.classList.add('show');
}
function calcularRAC(){
  const alb = parseFloat(document.getElementById('rac-alb').value);
  const creat = parseFloat(document.getElementById('rac-creat').value);
  const box = document.getElementById('rac-result');
  if(!alb || !creat){ alert('Preencha os dois valores.'); return; }
  const rac = (alb*100)/creat;
  let cat='A1: normal a levemente aumentada (<30 mg/g)';
  if(rac>300) cat='A3: gravemente aumentada (>300 mg/g)'; else if(rac>=30) cat='A2: moderadamente aumentada (30–300 mg/g)';
  box.innerHTML = '<div class="cr-valor">'+rac.toFixed(1)+'</div><div class="cr-unidade">mg/g</div><div class="cr-interp">Categoria KDIGO: <b>'+cat+'</b></div>';
  box.classList.add('show');
}
